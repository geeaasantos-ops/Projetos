<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soma e Subtração | Space Kids</title>

    <style>
        :root {
            --bg-espacial: #f5f7fa;
            --cor-texto: #6c7a89;
            --cor-pergunta: #a2d2ff;
            --cor-opcao: #ffffff;
            --cor-sucesso: #b9fbc0;
            --cor-tentar: #ffcfd2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background-color: var(--bg-espacial);

            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;

            overflow: hidden;

            position: relative;

            padding: 20px;
        }


        .fundo-animado {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: -1;

            background:
                linear-gradient(
                    180deg,
                    #f0f4ff 0%,
                    #f5f7fa 100%
                );
        }

        .estrela-cadente {
            position: absolute;

            width: 4px;
            height: 4px;

            background: #a2d2ff;

            border-radius: 50%;

            opacity: 0;

            animation: queda 4s infinite linear;
        }

        @keyframes queda {

            0% {
                transform: translate(0, 0);
                opacity: 0;
            }

            10% {
                opacity: 0.5;
            }

            50% {
                transform: translate(100px, 100px);
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }


        .container {
            background: rgba(255, 255, 255, 0.85);

            backdrop-filter: blur(10px);

            padding: 40px;

            border-radius: 35px;

            text-align: center;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.05);

            width: 90%;

            max-width: 450px;

            border: 4px solid white;

            transition: transform 0.3s ease;
        }


        .titulo {
            color: #8899a6;

            font-size: 1.2rem;

            margin-top: 0;
        }


        .equacao {
            font-size: 3.5rem;

            color: var(--cor-pergunta);

            font-weight: bold;

            margin-bottom: 20px;

            letter-spacing: 5px;
        }


        .feedback {
            min-height: 30px;

            font-weight: bold;

            margin-bottom: 25px;

            font-size: 1.1rem;

            transition: color 0.3s;
        }


        .grade-respostas {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .btn-resposta {
            background: var(--cor-opcao);

            border: 2px solid #eef2f7;

            padding: 20px;

            border-radius: 20px;

            font-size: 1.5rem;

            font-weight: bold;

            color: #5a6a7a;

            cursor: pointer;

            transition: all 0.2s;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .btn-resposta:hover:not(:disabled) {
            transform: translateY(-3px);

            border-color: #a2d2ff;
        }

        .btn-resposta:disabled {
            cursor: default;

            opacity: 0.8;
        }


        .proximo-btn {
            margin-top: 30px;

            background: #a2d2ff;

            color: white;

            border: none;

            padding: 15px 40px;

            border-radius: 50px;

            font-weight: bold;

            font-size: 1rem;

            cursor: pointer;

            display: none;

            transition: 0.2s;
        }

        .proximo-btn:hover {
            transform: scale(1.05);

            background: #8bc5f5;
        }


        .voltar-btn {
            display: inline-block;

            margin-top: 20px;

            color: #999;

            text-decoration: underline;

            font-size: 0.9rem;

            transition: 0.2s;
        }

        .voltar-btn:hover {
            color: #6c7a89;
        }


        @keyframes balanco {

            0%,
            100% {
                transform: rotate(0);
            }

            25% {
                transform: rotate(5deg);
            }

            75% {
                transform: rotate(-5deg);
            }
        }

        .vitoria {
            animation: balanco 0.5s ease-in-out;
        }


        @media (max-width: 600px) {

            .container {
                padding: 25px;

                width: 95%;
            }

            .equacao {
                font-size: 2.8rem;
            }

            .btn-resposta {
                padding: 15px;

                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>


    <div
        class="fundo-animado"
        id="estrelas">
    </div>



    <div
        class="container"
        id="container">

        <h1 class="titulo">
            Mestres da Matemática 🚀
        </h1>


        <!-- EQUAÇÃO -->

        <div
            id="displayEquacao"
            class="equacao">

            5 + 2

        </div>


        <!-- FEEDBACK -->

        <div
            id="feedback"
            class="feedback">

            Qual é o resultado?

        </div>


        <!-- OPÇÕES -->

        <div
            class="grade-respostas"
            id="opcoes">

        </div>


        <!-- PRÓXIMO DESAFIO -->

        <button
            id="btnProximo"
            class="proximo-btn"
            onclick="novoProblema()">

            Outro desafio! ❯

        </button>


        <!-- VOLTAR -->

        <a
            href="PÁGINA.HTML"
            class="voltar-btn">

            ← Voltar ao início

        </a>

    </div>



    <script>

        let resultadoCorreto;



        function criarEstrelas() {

            const fundo =
                document.getElementById('estrelas');

            for (let i = 0; i < 15; i++) {

                const estrela =
                    document.createElement('div');

                estrela.className =
                    'estrela-cadente';

                estrela.style.left =
                    Math.random() * 100 + '%';

                estrela.style.top =
                    Math.random() * 100 + '%';

                estrela.style.animationDelay =
                    Math.random() * 5 + 's';

                fundo.appendChild(estrela);
            }
        }



        function novoProblema() {

            const feedback =
                document.getElementById('feedback');

            const btnProximo =
                document.getElementById('btnProximo');

            const container =
                document.getElementById('container');

            const gridOpcoes =
                document.getElementById('opcoes');


            /* Resetar o jogo */

            feedback.innerText =
                "Qual é o resultado?";

            feedback.style.color =
                "var(--cor-texto)";

            btnProximo.style.display =
                "none";

            container.classList.remove(
                'vitoria'
            );


            /* Escolher operação */

            const operacao =
                Math.random() > 0.5
                    ? '+'
                    : '-';

            let n1;
            let n2;



            if (operacao === '+') {

                n1 =
                    Math.floor(
                        Math.random() * 6
                    ) + 1;

                n2 =
                    Math.floor(
                        Math.random() * 4
                    ) + 1;

                resultadoCorreto =
                    n1 + n2;
            }



            else {

                n1 =
                    Math.floor(
                        Math.random() * 6
                    ) + 5;

                n2 =
                    Math.floor(
                        Math.random() * 4
                    ) + 1;

                resultadoCorreto =
                    n1 - n2;
            }


            /* Mostrar equação */

            document.getElementById(
                'displayEquacao'
            ).innerText =
                `${n1} ${operacao} ${n2}`;



            let respostas = [
                resultadoCorreto
            ];


            while (respostas.length < 4) {

                const variacao =
                    Math.floor(
                        Math.random() * 3
                    ) + 1;

                const sinal =
                    Math.random() > 0.5
                        ? 1
                        : -1;

                const erro =
                    resultadoCorreto +
                    (variacao * sinal);


                if (
                    erro >= 0 &&
                    !respostas.includes(erro)
                ) {

                    respostas.push(erro);
                }
            }


            /* Embaralhar respostas */

            respostas.sort(
                () => Math.random() - 0.5
            );


            /* Limpar opções anteriores */

            gridOpcoes.innerHTML = '';


            /* Criar botões */

            respostas.forEach(
                function (resposta) {

                    const btn =
                        document.createElement(
                            'button'
                        );

                    btn.className =
                        'btn-resposta';

                    btn.innerText =
                        resposta;

                    btn.type =
                        'button';

                    btn.onclick =
                        function () {

                            verificar(
                                resposta,
                                btn
                            );

                        };

                    gridOpcoes.appendChild(btn);

                }
            );
        }



        function verificar(
            valor,
            botaoClicado
        ) {

            const feedback =
                document.getElementById(
                    'feedback'
                );

            const btnProximo =
                document.getElementById(
                    'btnProximo'
                );

            const container =
                document.getElementById(
                    'container'
                );


            /* RESPOSTA CORRETA */

            if (
                valor === resultadoCorreto
            ) {

                feedback.innerText =
                    "✨ Isso mesmo! Você conseguiu!";

                feedback.style.color =
                    "#77dd77";


                btnProximo.style.display =
                    "inline-block";


                container.classList.add(
                    'vitoria'
                );


                /* Desativar todas as opções */

                const botoes =
                    document.querySelectorAll(
                        '.btn-resposta'
                    );

                botoes.forEach(
                    function (botao) {

                        botao.disabled =
                            true;

                    }
                );


                /* Destacar resposta correta */

                botaoClicado.style.backgroundColor =
                    "#b9fbc0";

                botaoClicado.style.borderColor =
                    "#77dd77";

            }


            /* RESPOSTA ERRADA */

            else {

                feedback.innerText =
                    "Quase! Tente outra vez. 🚀";

                feedback.style.color =
                    "#ff9f9f";


                /* Destacar temporariamente */

                botaoClicado.style.backgroundColor =
                    "#ffcfd2";

                botaoClicado.style.borderColor =
                    "#ff9f9f";


                setTimeout(
                    function () {

                        botaoClicado.style.backgroundColor =
                            "";

                        botaoClicado.style.borderColor =
                            "";

                    },
                    600
                );
            }
        }



        criarEstrelas();

        novoProblema();

    </script>

</body>

</html>
