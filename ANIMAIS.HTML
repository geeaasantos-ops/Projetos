<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Qual o Animal? | Space Kids</title>


    <style>
/* ========================================
   SPACE KIDS — QUAL O ANIMAL?
   CSS fofo + rolagem vertical habilitada
======================================== */

:root {
    --bg-ceu: #f0f4ff;
    --cor-texto: #6d6485;
    --roxo: #cdb4db;
    --rosa: #ffc8dd;
    --azul: #a2d2ff;
    --azul-escuro: #7bb8f0;
    --amarelo: #fff1a8;
    --verde: #b9fbc0;
    --vermelho: #ffcfd2;
    --branco: #ffffff;
    --sombra: 0 12px 30px rgba(132, 115, 180, 0.16);
}

/* Configuração geral da página */
* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    width: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 30px 18px 40px;
    min-height: 100vh;
    height: auto;
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;

    overflow-x: hidden;
    overflow-y: auto;

    font-family: "Comic Sans MS", "Chalkboard SE", cursive;
    color: var(--cor-texto);

    background:
        radial-gradient(circle at 10% 15%, #ffffff 0 3px, transparent 4px),
        radial-gradient(circle at 85% 25%, #ffffff 0 4px, transparent 5px),
        radial-gradient(circle at 20% 80%, #fff1a8 0 4px, transparent 5px),
        linear-gradient(145deg, #f0f4ff, #fceeff 55%, #e2f4ff);
    background-attachment: fixed;
}

/* Estrelas decorativas criadas pelo JavaScript */
#estrelas,
.estrelas {
    pointer-events: none;
}

.estrela {
    position: absolute;
    color: #ffffff;
    opacity: 0.8;
    animation: brilhar 2.5s ease-in-out infinite alternate;
}

/* Cartão principal do jogo */
.container {
    position: relative;
    z-index: 1;

    width: 100%;
    max-width: 420px;
    min-height: auto;
    height: auto;

    margin: 15px auto 25px;
    padding: 30px 24px;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;

    background: rgba(255, 255, 255, 0.88);
    border: 3px solid rgba(255, 255, 255, 0.95);
    border-radius: 35px;

    box-shadow: var(--sombra);
    backdrop-filter: blur(10px);

    overflow: visible;
}

/* Título */
h1 {
    margin: 0;
    width: 100%;

    color: #9b82bd;
    font-size: clamp(1.7rem, 6vw, 2.2rem);
    line-height: 1.3;
    text-align: center;

    text-shadow: 2px 3px 0 #f5e5ff;
}

/* Texto de apoio, caso exista */
p {
    line-height: 1.6;
    text-align: center;
}

/* Área onde aparece o animal */
.display-animal {
    width: 150px;
    height: 150px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(145deg, #ffffff, #f6edff);
    border: 4px solid #e9d9ff;
    border-radius: 50%;

    box-shadow:
        0 8px 0 #e8dcf8,
        0 12px 22px rgba(160, 130, 200, 0.13);

    font-size: 5rem;
    animation: flutuar 3s ease-in-out infinite;
}

/* Emoji dentro da área do animal */
.display-animal span,
.display-animal div {
    max-width: 100%;
}

/* Mensagem de resposta */
.feedback-msg {
    width: 100%;
    min-height: 48px;
    padding: 12px 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;
    background: #f6f0ff;

    color: #8271a4;
    font-size: 1rem;
    font-weight: bold;
    text-align: center;

    overflow-wrap: anywhere;
    transition: background 0.25s ease, color 0.25s ease;
}

/* Grade das respostas */
.grade-botoes {
    width: 100%;

    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

/* Botões de resposta */
.btn-opcao {
    width: 100%;
    min-height: 58px;
    padding: 13px 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;
    border: 2px solid #e5d9f7;
    border-radius: 20px;

    color: #786b94;
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    text-align: center;

    box-shadow: 0 5px 0 #e8dff5;
    cursor: pointer;

    overflow-wrap: anywhere;
    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.btn-opcao:hover {
    background: #fff3fa;
    border-color: var(--rosa);
    transform: translateY(-3px);
    box-shadow: 0 8px 0 #f4dce9;
}

.btn-opcao:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #e8dff5;
}

.btn-opcao:focus-visible,
.btn-proximo:focus-visible,
.voltar:focus-visible {
    outline: 3px solid #8d79c7;
    outline-offset: 4px;
}

/* Botão para jogar novamente */
.btn-proximo {
    display: none;

    width: 100%;
    min-height: 55px;
    margin-top: 5px;
    padding: 14px 18px;

    align-items: center;
    justify-content: center;

    background: linear-gradient(135deg, #a2d2ff, #cdb4db);
    border: none;
    border-radius: 22px;

    color: #ffffff;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: bold;
    text-align: center;

    box-shadow: 0 6px 0 #b5a0d2;
    cursor: pointer;

    overflow-wrap: anywhere;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn-proximo:hover {
    transform: translateY(-3px);
    box-shadow: 0 9px 0 #b5a0d2;
}

.btn-proximo:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 #b5a0d2;
}

/* Link para voltar */
.voltar {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 45px;
    margin: 10px auto 20px;
    padding: 12px 20px;

    background: rgba(255, 255, 255, 0.85);
    border: 2px solid #e6d8f6;
    border-radius: 20px;

    color: #8c78ad;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: bold;
    text-align: center;
    text-decoration: none;

    box-shadow: 0 4px 0 #e6d8f6;
    cursor: pointer;

    transition: transform 0.2s ease, background 0.2s ease;
}

.voltar:hover {
    background: #fff1f8;
    transform: translateY(-2px);
}

/* Animações */
@keyframes flutuar {
    0%, 100% {
        transform: translateY(0) rotate(-2deg);
    }

    50% {
        transform: translateY(-7px) rotate(2deg);
    }
}

@keyframes brilhar {
    from {
        opacity: 0.35;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1.15);
    }
}

/* Telas menores, como celulares */
@media (max-width: 480px) {
    body {
        padding: 18px 12px 35px;
    }

    .container {
        width: 100%;
        padding: 24px 16px;
        margin-top: 8px;
        border-radius: 28px;
        gap: 16px;
    }

    .display-animal {
        width: 125px;
        height: 125px;
        font-size: 4.2rem;
    }

    .grade-botoes {
        gap: 10px;
    }

    .btn-opcao {
        min-height: 56px;
        padding: 12px 6px;
        font-size: 0.95rem;
    }

    .btn-proximo {
        min-height: 55px;
    }
}

/* Telas muito baixas ou em modo paisagem */
@media (max-height: 600px) {
    body {
        justify-content: flex-start;
        padding-top: 15px;
        padding-bottom: 35px;
    }

    .container {
        margin-top: 5px;
        margin-bottom: 20px;
    }

    .display-animal {
        width: 110px;
        height: 110px;
        font-size: 3.7rem;
    }
}

/* Respeita quem prefere menos animações */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}
    </style>

</head>


<body>



    <div
        class="fundo-interativo"
        id="espacoEstelar">
    </div>



    <div class="container">


        <h1>
            Quem é ele? 🐾
        </h1>



        <div
            id="animalEmoji"
            class="display-animal"
            aria-live="polite"
            aria-label="Animal da rodada"
        >
            🐶
        </div>



        <div
            id="feedback"
            class="feedback-msg"
            aria-live="polite"
        >
            Toque no nome do animal!
        </div>



        <div
            class="grade-botoes"
            id="opcoes"
        >
        </div>



        <button
            type="button"
            id="btnNovo"
            class="btn-proximo"
            onclick="iniciarJogo()"
        >
            Jogar de novo! 🚀
        </button>



        <a
            href="PÁGINA.HTML"
            class="voltar"
        >
            ← Voltar ao Início
        </a>


    </div>



    <script>



        const listaAnimais = [

            {
                emoji: '🐶',
                nome: 'Cachorro'
            },

            {
                emoji: '🐱',
                nome: 'Gato'
            },

            {
                emoji: '🐘',
                nome: 'Elefante'
            },

            {
                emoji: '🦁',
                nome: 'Leão'
            },

            {
                emoji: '🦒',
                nome: 'Girafa'
            },

            {
                emoji: '🐸',
                nome: 'Sapo'
            },

            {
                emoji: '🦋',
                nome: 'Borboleta'
            }

        ];



        let animalCerto;



        function criarEstrelas() {

            const fundo =
                document.getElementById(
                    'espacoEstelar'
                );


            for (
                let i = 0;
                i < 20;
                i++
            ) {

                const estrela =
                    document.createElement(
                        'div'
                    );


                estrela.className =
                    'estrela';


                const tamanho =
                    Math.random() * 10 + 5;


                estrela.style.width =
                    tamanho + 'px';


                estrela.style.height =
                    tamanho + 'px';


                estrela.style.left =
                    Math.random() * 100 + '%';


                estrela.style.top =
                    Math.random() * 100 + '%';


                estrela.style.animationDelay =
                    Math.random() * 3 + 's';


                fundo.appendChild(
                    estrela
                );
            }
        }



        function iniciarJogo() {

            const feedback =
                document.getElementById(
                    'feedback'
                );


            const btnNovo =
                document.getElementById(
                    'btnNovo'
                );


            const display =
                document.getElementById(
                    'animalEmoji'
                );


            const containerOpcoes =
                document.getElementById(
                    'opcoes'
                );



            feedback.innerText =
                "Toque no nome do animal!";


            feedback.style.color =
                "var(--cor-texto)";


            btnNovo.style.display =
                "none";


            display.style.transform =
                "scale(1)";



            const indice =
                Math.floor(
                    Math.random() *
                    listaAnimais.length
                );


            animalCerto =
                listaAnimais[indice];


            display.innerText =
                animalCerto.emoji;



            const opcoes =
                [animalCerto.nome];



            while (
                opcoes.length < 4
            ) {

                const indiceAleatorio =
                    Math.floor(
                        Math.random() *
                        listaAnimais.length
                    );


                const nome =
                    listaAnimais[
                        indiceAleatorio
                    ].nome;


                if (
                    !opcoes.includes(nome)
                ) {

                    opcoes.push(nome);
                }
            }



            opcoes.sort(
                () =>
                    Math.random() - 0.5
            );



            containerOpcoes.innerHTML =
                '';



            opcoes.forEach(
                function (opcao) {

                    const btn =
                        document.createElement(
                            'button'
                        );


                    btn.type =
                        'button';


                    btn.className =
                        'btn-opcao';


                    btn.innerText =
                        opcao;


                    btn.onclick =
                        function () {

                            validar(
                                opcao,
                                btn
                            );

                        };


                    containerOpcoes.appendChild(
                        btn
                    );

                }
            );
        }


        function validar(
            escolha,
            botaoClicado
        ) {

            const feedback =
                document.getElementById(
                    'feedback'
                );


            const display =
                document.getElementById(
                    'animalEmoji'
                );


            const btnNovo =
                document.getElementById(
                    'btnNovo'
                );



            if (
                escolha ===
                animalCerto.nome
            ) {

                feedback.innerText =
                    "🌟 Incrível! Você acertou!";


                feedback.style.color =
                    "#77dd77";


                display.style.transform =
                    "scale(1.2) rotate(10deg)";


                btnNovo.style.display =
                    "inline-block";



                const botoes =
                    document.querySelectorAll(
                        '.btn-opcao'
                    );


                botoes.forEach(
                    function (botao) {

                        botao.disabled =
                            true;

                    }
                );



                botaoClicado.style.backgroundColor =
                    "#b9fbc0";


                botaoClicado.style.borderColor =
                    "#77dd77";
            }



            else {

                feedback.innerText =
                    "Hum... tente outra vez! 🚀";


                feedback.style.color =
                    "#ff9f9f";


                botaoClicado.style.backgroundColor =
                    "#ffcfd2";


                botaoClicado.style.borderColor =
                    "#ff9f9f";



                setTimeout(
                    function () {

                        botaoClicado.style.backgroundColor =
                            "";

                        botaoClicado.style.borderColor =
                            "";

                    },
                    600
                );
            }
        }



        criarEstrelas();

        iniciarJogo();


    </script>


</body>

</html>
