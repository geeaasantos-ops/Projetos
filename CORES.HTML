<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Qual a Cor? | Space Kids</title>

    <style>
        :root {
            --bg-pastel: #fdfcf0;
            --texto: #6b7a8f;

            --rosa: #ffb7b2;
            --azul: #a2d2ff;
            --verde: #b9fbc0;
            --amarelo: #faedcb;
            --roxo: #e1ccff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-pastel);
            color: var(--texto);

            margin: 0;
            padding: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        #mensagem {
            min-height: 30px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #8899a6;
        }

        #corAlvo {
            width: 150px;
            height: 150px;

            border-radius: 30px;
            margin: 0 auto 30px;

            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border: 8px solid white;

            transition: transform 0.3s ease;
        }

        .grade-opcoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-cor {
            border: none;
            padding: 20px;

            border-radius: 20px;

            font-size: 1.1rem;
            font-weight: bold;

            cursor: pointer;

            background: white;
            color: #555;

            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);

            transition:
                transform 0.2s,
                background-color 0.2s,
                opacity 0.2s;
        }

        .btn-cor:hover {
            transform: translateY(-3px);
        }

        .btn-cor:active {
            transform: scale(0.95);
        }

        .btn-cor:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-correto {
            background-color: var(--verde);
        }

        #btnProximo {
            margin-top: 30px;

            padding: 12px 30px;

            border-radius: 50px;
            border: none;

            background-color: var(--azul);
            color: white;

            font-weight: bold;
            font-size: 1rem;

            cursor: pointer;

            display: none;

            transition: transform 0.2s, background-color 0.2s;
        }

        #btnProximo:hover {
            transform: scale(1.05);
            background-color: #82bfff;
        }

        .voltar {
            display: inline-block;

            margin-top: 20px;

            color: #999;
            text-decoration: underline;

            font-size: 0.95rem;

            transition: color 0.2s;
        }

        .voltar:hover {
            color: #555;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 500px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.3rem;
            }

            #corAlvo {
                width: 130px;
                height: 130px;
            }

            .grade-opcoes {
                grid-template-columns: 1fr;
            }

            .btn-cor {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>🎨 Qual é esta cor?</h1>

        <p id="mensagem" aria-live="polite">
            Toque no nome da cor certa!
        </p>

        <!-- COR QUE O JOGADOR PRECISA IDENTIFICAR -->
        <div
            id="corAlvo"
            role="img"
            aria-label="Cor para identificar"
        ></div>

        <!-- OPÇÕES -->
        <div
            class="grade-opcoes"
            id="opcoesContainer"
        ></div>

        <!-- PRÓXIMA COR -->
        <button
            type="button"
            id="btnProximo"
            onclick="novoJogo()"
        >
            Próxima Cor ❯
        </button>

        <!-- VOLTAR PARA A PÁGINA PRINCIPAL -->
        <a
            href="PÁGINA.HTML"
            class="voltar"
        >
            ← Voltar ao Início
        </a>

    </main>


    <script>


        const cores = [
            {
                nome: 'Rosa',
                hex: '#ffb7b2'
            },
            {
                nome: 'Azul',
                hex: '#a2d2ff'
            },
            {
                nome: 'Verde',
                hex: '#b9fbc0'
            },
            {
                nome: 'Amarelo',
                hex: '#faedcb'
            },
            {
                nome: 'Roxo',
                hex: '#e1ccff'
            }
        ];


        let corCorreta = null;



        function novoJogo() {

            const mensagem = document.getElementById('mensagem');
            const btnProximo = document.getElementById('btnProximo');
            const alvo = document.getElementById('corAlvo');
            const container = document.getElementById('opcoesContainer');

            // Mensagem inicial
            mensagem.innerText = "Toque no nome da cor certa!";
            mensagem.style.color = "#8899a6";

            // Esconde botão de próxima cor
            btnProximo.style.display = "none";

            // Escolhe uma cor aleatória
            corCorreta =
                cores[Math.floor(Math.random() * cores.length)];

            // Mostra a cor escolhida
            alvo.style.backgroundColor = corCorreta.hex;
            alvo.style.transform = "scale(1)";

            alvo.setAttribute(
                "aria-label",
                "Identifique a cor mostrada"
            );

            // Limpa as opções anteriores
            container.innerHTML = "";



            cores.forEach(function(cor) {

                const btn = document.createElement("button");

                btn.type = "button";
                btn.className = "btn-cor";
                btn.innerText = cor.nome;

                btn.addEventListener("click", function() {

                    verificarResposta(
                        cor.nome,
                        btn
                    );

                });

                container.appendChild(btn);

            });

        }



        function verificarResposta(nomeEscolhido, botaoEscolhido) {

            const mensagem =
                document.getElementById('mensagem');

            const alvo =
                document.getElementById('corAlvo');

            const btnProximo =
                document.getElementById('btnProximo');

            const botoes =
                document.querySelectorAll('.btn-cor');


            // RESPOSTA CORRETA
            if (nomeEscolhido === corCorreta.nome) {

                mensagem.innerText =
                    "🌟 Parabéns! Você acertou!";

                mensagem.style.color =
                    "#55a85a";

                alvo.style.transform =
                    "scale(1.1)";

                btnProximo.style.display =
                    "inline-block";


                // Desativa todos os botões
                botoes.forEach(function(btn) {

                    btn.disabled = true;

                });


                // Destaca a resposta correta
                botaoEscolhido.classList.add(
                    "btn-correto"
                );

            }

            // RESPOSTA INCORRETA
            else {

                mensagem.innerText =
                    "💭 Hum... tente outra cor!";

                mensagem.style.color =
                    "#e58d87";

                botaoEscolhido.style.opacity =
                    "0.6";

            }

        }



        novoJogo();

    </script>

</body>

</html>
