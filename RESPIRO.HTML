<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Respiro Lunar | Space Kids</title>

<style>
:root {
    --fundo: #effbf5;
    --verde: #b8edc5;
    --verde-forte: #8dcea0;
    --azul: #dff2ff;
    --lilas: #e8ddff;
    --texto: #5b7565;
    --branco: #ffffff;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px 40px;

    font-family: 'Comic Sans MS', 'Chalkboard SE',
        cursive, sans-serif;

    color: var(--texto);
    text-align: center;

    background:
        radial-gradient(circle at 10% 15%,
            rgba(255, 255, 255, 0.95) 0 4px,
            transparent 5px),
        radial-gradient(circle at 88% 22%,
            rgba(255, 255, 255, 0.85) 0 5px,
            transparent 6px),
        radial-gradient(circle at 15% 78%,
            rgba(205, 239, 213, 0.8) 0 6px,
            transparent 7px),
        linear-gradient(
            140deg,
            #effbf5 0%,
            #e6f4ff 52%,
            #f0eaff 100%
        );

    background-size:
        110px 110px,
        150px 150px,
        180px 180px,
        auto;

    background-attachment: fixed;
}

/* Cabeçalho */

header {
    margin: 14px auto 30px;
    max-width: 700px;
}

header h1 {
    font-size: clamp(2rem, 5vw, 2.7rem);
    color: #689878;

    margin: 25px 0 12px;

    text-shadow: 2px 3px 0 #ffffff;
    letter-spacing: 0.5px;
}

header p {
    max-width: 550px;
    margin: 0 auto;

    font-size: 1.08rem;
    line-height: 1.8;
    color: #718b7a;
}

/* Botão voltar */

.voltar {
    display: inline-block;

    background: rgba(255, 255, 255, 0.92);
    color: #648d70;

    padding: 11px 23px;

    border: 2px solid #ffffff;
    border-radius: 30px;

    text-decoration: none;
    font-weight: bold;

    box-shadow:
        0 5px 0 #d4e9d8,
        0 8px 16px rgba(86, 133, 100, 0.12);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

.voltar:hover {
    background: #fafffb;
    transform: translateY(-3px);

    box-shadow:
        0 8px 0 #d4e9d8,
        0 12px 20px rgba(86, 133, 100, 0.15);
}

.voltar:focus-visible {
    outline: 3px solid #76b68a;
    outline-offset: 4px;
}

/* Painel principal */

.respiracao {
    max-width: 850px;
    width: 100%;
    margin: 30px auto;

    padding: clamp(22px, 5vw, 40px) 24px;

    background: rgba(255, 255, 255, 0.86);

    border: 3px solid rgba(255, 255, 255, 0.98);
    border-radius: 35px;

    box-shadow:
        0 12px 30px rgba(94, 139, 108, 0.13),
        inset 0 0 20px rgba(255, 255, 255, 0.7);

    backdrop-filter: blur(8px);
}

/* Instruções de respiração */

.instrucao {
    font-size: clamp(1.25rem, 4vw, 1.7rem);
    font-weight: bold;

    min-height: 55px;
    margin-bottom: 30px;

    color: #739d7e;
    line-height: 1.6;

    text-shadow: 1px 2px 0 #f1fff4;
}

/* Trilha da bolinha */

.linha {
    width: 90%;
    max-width: 650px;
    height: 12px;

    background: linear-gradient(
        90deg,
        #d5f0dc,
        #dceeff,
        #e8ddff
    );

    border: 2px solid #ffffff;
    border-radius: 30px;

    margin: 55px auto;
    position: relative;

    box-shadow:
        inset 0 2px 5px rgba(93, 139, 106, 0.08),
        0 3px 8px rgba(93, 139, 106, 0.06);
}

/* Bolinha lunar */

.bolinha {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: radial-gradient(
        circle at 30% 25%,
        #effff1 0%,
        #b8edc5 42%,
        #8dcea0 100%
    );

    border: 3px solid #ffffff;

    position: absolute;
    top: 50%;
    left: 0;

    transform: translateY(-50%);

    box-shadow:
        0 0 0 6px rgba(184, 237, 197, 0.25),
        0 5px 15px rgba(80, 130, 90, 0.2);

    transition: box-shadow 0.3s ease;
}

.bolinha.animando {
    animation:
        respirar 12s ease-in-out infinite,
        brilho 3s ease-in-out infinite;
}

@keyframes respirar {
    0% {
        left: 0;
    }

    33% {
        left: calc(100% - 48px);
    }

    50% {
        left: calc(100% - 48px);
    }

    100% {
        left: 0;
    }
}

@keyframes brilho {
    0%, 100% {
        box-shadow:
            0 0 0 5px rgba(184, 237, 197, 0.2),
            0 5px 15px rgba(80, 130, 90, 0.2);
    }

    50% {
        box-shadow:
            0 0 0 10px rgba(184, 237, 197, 0.15),
            0 5px 22px rgba(80, 130, 90, 0.28);
    }
}

/* Etapas */

.etapas {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;

    max-width: 650px;
    margin: -20px auto 32px;

    font-size: 0.95rem;
    color: #718b7a;
}

.etapas span {
    flex: 1;

    padding: 10px 8px;

    background: linear-gradient(
        135deg,
        #f1fff4,
        #edf6ff
    );

    border: 1px solid #dcefe1;
    border-radius: 18px;

    box-shadow: 0 3px 8px rgba(86, 133, 100, 0.06);
}

/* Botão começar */

button {
    border: 2px solid #ffffff;

    background: linear-gradient(
        135deg,
        #a9dfb5,
        #8dcea0
    );

    color: #ffffff;

    padding: 14px 30px;
    border-radius: 30px;

    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 0 #78b98a,
        0 8px 15px rgba(86, 133, 100, 0.14);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
}

button:hover {
    transform: translateY(-3px);
    filter: brightness(1.04);

    box-shadow:
        0 8px 0 #78b98a,
        0 12px 20px rgba(86, 133, 100, 0.18);
}

button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #78b98a;
}

button:focus-visible {
    outline: 3px solid #6eaa7e;
    outline-offset: 4px;
}

/* Contador */

.contador {
    display: inline-block;

    margin-top: 24px;
    padding: 12px 22px;

    min-width: 190px;

    font-size: 1rem;
    line-height: 1.6;
    color: #718b7a;

    background: #f2fff5;
    border: 2px solid #e0f2e4;
    border-radius: 22px;
}

/* Celulares */

@media (max-width: 600px) {
    body {
        padding: 16px 10px 30px;
    }

    header {
        margin-bottom: 22px;
    }

    header p {
        font-size: 1rem;
    }

    .respiracao {
        padding: 24px 14px;
        border-radius: 27px;
    }

    .instrucao {
        margin-bottom: 20px;
    }

    .linha {
        width: 94%;
        margin: 48px auto;
    }

    .bolinha {
        width: 40px;
        height: 40px;
    }

    @keyframes respirar {
        0% {
            left: 0;
        }

        33% {
            left: calc(100% - 40px);
        }

        50% {
            left: calc(100% - 40px);
        }

        100% {
            left: 0;
        }
    }

    .etapas {
        gap: 6px;
        font-size: 0.78rem;
    }

    .etapas span {
        padding: 9px 4px;
        border-radius: 14px;
    }

    button {
        padding: 13px 25px;
    }
}

/* Respeita a preferência por menos animações */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

</head>

<body>

<header>

    <a
        href="PÁGINA.HTML"
        class="voltar"
    >
        ← Voltar
    </a>

    <h1>
        🌙 Respiro Lunar
    </h1>

    <p>
        Vamos respirar juntos, devagar e com calma.
    </p>

</header>


<main class="respiracao">

    <div
        class="instrucao"
        id="instrucao"
    >
        Quando estiver pronto, comece.
    </div>


    <div class="linha">

        <div
            class="bolinha"
            id="bolinha"
        ></div>

    </div>


    <div class="etapas">

        <span>
            🌬️ Inspirar
        </span>

        <span>
            ⏸️ Segurar
        </span>

        <span>
            💨 Expirar
        </span>

    </div>


    <button onclick="iniciarRespiracao()">
        🌙 Começar
    </button>


    <div
        class="contador"
        id="contador"
    >
        Pronto para começar?
    </div>

</main>


<script>

    const instrucao =
        document.getElementById("instrucao");

    const contador =
        document.getElementById("contador");

    const bolinha =
        document.getElementById("bolinha");


    let executando = false;


    async function iniciarRespiracao() {

        if (executando) return;

        executando = true;

        bolinha.classList.add("animando");


        while (executando) {


            instrucao.textContent =
                "🌬️ Inspire devagar...";

            await contar(4);


            if (!executando) break;



            instrucao.textContent =
                "⏸️ Segure suavemente...";

            await contar(4);


            if (!executando) break;




            instrucao.textContent =
                "💨 Expire lentamente...";

            await contar(6);

        }

    }


    function contar(segundos) {

        return new Promise(resolve => {

            let restante = segundos;

            contador.textContent =
                "⏱️ " + restante;


            const intervalo =
                setInterval(() => {

                    restante--;

                    if (restante <= 0) {

                        clearInterval(intervalo);

                        resolve();

                    } else {

                        contador.textContent =
                            "⏱️ " + restante;

                    }

                }, 1000);

        });

    }

</script>

</body>

</html>
