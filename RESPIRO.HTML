<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Respiro Lunar | Space Kids</title>

<style>

    :root {
        --fundo: #eefbf2;
        --verde: #b9fbc0;
        --texto: #58705d;
    }

    * {
        box-sizing: border-box;
    }

    body {

        margin: 0;

        min-height: 100vh;

        padding: 20px;

        font-family:
            'Comic Sans MS',
            'Chalkboard SE',
            cursive;

        background:
            linear-gradient(
                135deg,
                #eefbf2,
                #e4f2ff
            );

        color: var(--texto);

        text-align: center;
    }

    header {
        margin: 20px auto;

        max-width: 700px;
    }

    header h1 {
        font-size: 2.4rem;

        color: #5e8066;
    }

    .voltar {
        display: inline-block;

        background: white;

        color: #5e8066;

        padding: 10px 20px;

        border-radius: 30px;

        text-decoration: none;

        font-weight: bold;
    }

    .respiracao {

        max-width: 850px;

        margin: 30px auto;

        background: rgba(
            255,
            255,
            255,
            .85
        );

        padding: 35px 25px;

        border-radius: 30px;

        box-shadow:
            0 10px 25px
            rgba(0,0,0,.07);
    }

    .instrucao {

        font-size: 1.6rem;

        font-weight: bold;

        min-height: 40px;

        margin-bottom: 30px;
    }

    .linha {

        width: 90%;

        max-width: 650px;

        height: 8px;

        background: #d8eade;

        border-radius: 20px;

        margin: 50px auto;

        position: relative;
    }

    .bolinha {

        width: 45px;

        height: 45px;

        border-radius: 50%;

        background: #8fd69a;

        position: absolute;

        top: 50%;

        left: 0;

        transform: translateY(-50%);

        box-shadow:
            0 5px 15px
            rgba(80,130,90,.25);
    }

    .bolinha.animando {

        animation:
            respirar 12s
            ease-in-out
            infinite;
    }

    @keyframes respirar {

        0% {
            left: 0;
        }

        33% {
            left: calc(100% - 45px);
        }

        50% {
            left: calc(100% - 45px);
        }

        100% {
            left: 0;
        }

    }

    .etapas {

        display: flex;

        justify-content: space-between;

        max-width: 650px;

        margin: -20px auto 30px;

        font-size: .9rem;
    }

    button {

        border: none;

        background: #8fd69a;

        color: white;

        padding: 13px 25px;

        border-radius: 30px;

        font-family: inherit;

        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        transform: scale(1.05);
    }

    .contador {

        margin-top: 20px;

        font-size: 1rem;
    }

</style>

</head>

<body>

<header>

    <a
        href="PÁGINA.HTML"
        class="voltar"
    >
        ← Voltar
    </a>

    <h1>
        🌙 Respiro Lunar
    </h1>

    <p>
        Vamos respirar juntos, devagar e com calma.
    </p>

</header>


<main class="respiracao">

    <div
        class="instrucao"
        id="instrucao"
    >
        Quando estiver pronto, comece.
    </div>


    <div class="linha">

        <div
            class="bolinha"
            id="bolinha"
        ></div>

    </div>


    <div class="etapas">

        <span>
            🌬️ Inspirar
        </span>

        <span>
            ⏸️ Segurar
        </span>

        <span>
            💨 Expirar
        </span>

    </div>


    <button onclick="iniciarRespiracao()">
        🌙 Começar
    </button>


    <div
        class="contador"
        id="contador"
    >
        Pronto para começar?
    </div>

</main>


<script>

    const instrucao =
        document.getElementById("instrucao");

    const contador =
        document.getElementById("contador");

    const bolinha =
        document.getElementById("bolinha");


    let executando = false;


    async function iniciarRespiracao() {

        if (executando) return;

        executando = true;

        bolinha.classList.add("animando");


        while (executando) {


            instrucao.textContent =
                "🌬️ Inspire devagar...";

            await contar(4);


            if (!executando) break;



            instrucao.textContent =
                "⏸️ Segure suavemente...";

            await contar(4);


            if (!executando) break;




            instrucao.textContent =
                "💨 Expire lentamente...";

            await contar(6);

        }

    }


    function contar(segundos) {

        return new Promise(resolve => {

            let restante = segundos;

            contador.textContent =
                "⏱️ " + restante;


            const intervalo =
                setInterval(() => {

                    restante--;

                    if (restante <= 0) {

                        clearInterval(intervalo);

                        resolve();

                    } else {

                        contador.textContent =
                            "⏱️ " + restante;

                    }

                }, 1000);

        });

    }

</script>

</body>

</html>
