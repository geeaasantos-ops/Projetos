<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nebulosa do Silêncio | Space Kids</title>

<style>
:root {
    --fundo: #f5f0ff;
    --azul: #b9dcff;
    --roxo: #cdb4f5;
    --rosa: #f8cde8;
    --texto: #655b80;
    --branco: #ffffff;
    --amarelo: #ffe9a8;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px 40px;

    font-family: 'Comic Sans MS', 'Chalkboard SE',
        cursive, sans-serif;

    color: var(--texto);

    background:
        radial-gradient(circle at 10% 15%,
            rgba(255, 255, 255, 0.9) 0 3px,
            transparent 4px),
        radial-gradient(circle at 88% 22%,
            rgba(255, 255, 255, 0.8) 0 4px,
            transparent 5px),
        radial-gradient(circle at 15% 80%,
            rgba(255, 233, 168, 0.65) 0 5px,
            transparent 6px),
        linear-gradient(
            145deg,
            #f5f0ff 0%,
            #e9f4ff 50%,
            #fceafa 100%
        );

    background-size:
        100px 100px,
        140px 140px,
        170px 170px,
        auto;

    background-attachment: fixed;
}

/* Cabeçalho */

header {
    text-align: center;
    margin: 15px auto 30px;
    max-width: 800px;
}

header h1 {
    color: #8872b5;
    font-size: clamp(1.8rem, 5vw, 2.7rem);
    margin: 25px 0 12px;
    text-shadow: 2px 3px 0 #ffffff;
    letter-spacing: 0.5px;
}

header p {
    font-size: 1.08rem;
    line-height: 1.8;
    max-width: 600px;
    margin: 0 auto;
    color: #776c91;
}

/* Botão de voltar */

.voltar {
    display: inline-block;
    background: rgba(255, 255, 255, 0.9);
    color: #8872b5;

    padding: 11px 22px;
    border: 2px solid #ffffff;
    border-radius: 30px;

    text-decoration: none;
    font-weight: bold;

    box-shadow: 0 5px 0 #e1d5f5,
                0 8px 18px rgba(111, 91, 153, 0.12);

    transition: transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
}

.voltar:hover {
    background: #fff7fc;
    transform: translateY(-3px);
    box-shadow: 0 8px 0 #e1d5f5,
                0 12px 20px rgba(111, 91, 153, 0.15);
}

.voltar:focus-visible {
    outline: 3px solid #8b75c5;
    outline-offset: 4px;
}

/* Painel principal */

.area-jogo {
    position: relative;
    max-width: 750px;
    width: 100%;
    margin: 0 auto;

    background: rgba(255, 255, 255, 0.82);
    padding: clamp(20px, 5vw, 38px);

    border: 3px solid rgba(255, 255, 255, 0.95);
    border-radius: 35px;

    text-align: center;

    box-shadow:
        0 12px 30px rgba(125, 106, 167, 0.13),
        inset 0 0 20px rgba(255, 255, 255, 0.6);

    backdrop-filter: blur(8px);
}

.area-jogo h2 {
    color: #8c78b7;
    font-size: clamp(1.35rem, 4vw, 1.8rem);
    margin-top: 0;
    margin-bottom: 15px;
}

.area-jogo > p {
    color: #7d7395;
    line-height: 1.8;
    margin: 12px auto;
}

/* Tabuleiro */

.quebra-cabeca {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 110px));
    justify-content: center;
    gap: 8px;

    width: 100%;
    margin: 28px auto;
    padding: 12px;

    background: linear-gradient(135deg, #f8f2ff, #edf7ff);
    border: 2px dashed #d8c8f3;
    border-radius: 25px;
}

/* Peças do quebra-cabeça */

.peca {
    width: 100%;
    aspect-ratio: 1 / 1;
    min-width: 0;
    height: auto;

    border: 2px solid #ffffff;
    border-radius: 19px;

    cursor: pointer;
    font-size: clamp(1.6rem, 5vw, 2.5rem);

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(145deg, #e6f2ff, #dcd9ff);

    box-shadow:
        0 5px 0 #c9c8ef,
        0 7px 12px rgba(115, 109, 164, 0.10);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.peca:hover {
    transform: translateY(-3px) scale(1.03);
    background: linear-gradient(145deg, #fff0fa, #e7e1ff);
    box-shadow:
        0 7px 0 #d5c2ed,
        0 10px 15px rgba(115, 109, 164, 0.15);
}

.peca:active {
    transform: scale(0.96);
}

.peca:focus-visible {
    outline: 3px solid #9b82d0;
    outline-offset: 3px;
}

/* Espaço vazio */

.vazia {
    background: rgba(224, 216, 246, 0.35);
    border: 2px dashed #d5c7eb;
    box-shadow: inset 0 0 12px rgba(149, 129, 191, 0.08);
    cursor: default;
}

.vazia:hover {
    transform: none;
    background: rgba(224, 216, 246, 0.35);
    box-shadow: inset 0 0 12px rgba(149, 129, 191, 0.08);
}

/* Controles */

.controles {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

.controles button {
    border: 2px solid #ffffff;
    padding: 13px 25px;
    border-radius: 30px;

    background: linear-gradient(135deg, #cdb4f5, #b8caff);
    color: #ffffff;

    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;

    cursor: pointer;
    margin: 5px;

    box-shadow: 0 5px 0 #b2a0dc,
                0 8px 14px rgba(125, 106, 167, 0.15);

    transition: transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
}

.controles button:hover {
    transform: translateY(-3px);
    filter: brightness(1.04);
    box-shadow: 0 8px 0 #b2a0dc,
                0 11px 18px rgba(125, 106, 167, 0.18);
}

.controles button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #b2a0dc;
}

.controles button:focus-visible {
    outline: 3px solid #8872b5;
    outline-offset: 4px;
}

/* Mensagem de conclusão */

#mensagem {
    min-height: 30px;
    font-weight: bold;
    font-size: 1.05rem;
    line-height: 1.7;

    margin: 18px 0 8px;
    padding: 10px;

    color: #7b6aa6;
    border-radius: 18px;

    overflow-wrap: anywhere;
}

/* Adaptação para celulares */

@media (max-width: 600px) {
    body {
        padding: 16px 12px 30px;
    }

    header {
        margin: 12px auto 24px;
    }

    header p {
        font-size: 1rem;
    }

    .area-jogo {
        border-radius: 26px;
        padding: 20px 12px;
    }

    .quebra-cabeca {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        max-width: 330px;
        gap: 6px;
        padding: 8px;
        border-radius: 20px;
    }

    .peca {
        border-radius: 14px;
        font-size: clamp(1.4rem, 8vw, 2.2rem);
    }

    .controles button {
        max-width: 100%;
        padding: 12px 20px;
    }
}

/* Respeita a preferência por menos animações */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

</head>

<body>

<header>

    <a class="voltar" href="PÁGINA.HTML">
        ← Voltar
    </a>

    <h1>🌌 Nebulosa do Silêncio</h1>

    <p>
        Encontre a ordem das estrelas e complete
        o pequeno quebra-cabeça.
    </p>

</header>


<main class="area-jogo">

    <h2 id="tituloPuzzle">
        ⭐ Organize as estrelas
    </h2>

    <p>
        Clique em uma peça ao lado do espaço vazio
        para movimentá-la.
    </p>


    <div
        id="quebraCabeca"
        class="quebra-cabeca"
    ></div>


    <div id="mensagem"></div>


    <div class="controles">

        <button onclick="novoPuzzle()">
            🌟 Novo desafio
        </button>

    </div>

</main>


<script>

    const quebraCabeca =
        document.getElementById("quebraCabeca");

    const mensagem =
        document.getElementById("mensagem");


    let tabuleiro = [];

    let puzzleAtual = 0;


    const puzzles = [

        ["🌙","⭐","🌟","✨","🌌","💫","☁️","🪐",""],

        ["🚀","🌙","⭐","🪐","✨","🌟","💫","☁️",""],

        ["🌟","💫","🌙","⭐","🪐","✨","☁️","🚀",""],

        ["🪐","⭐","🚀","🌌","🌙","💫","✨","☁️",""]

    ];


    function novoPuzzle() {

        puzzleAtual++;

        if (puzzleAtual >= puzzles.length) {
            puzzleAtual = 0;
        }

        tabuleiro =
            [...puzzles[puzzleAtual]];

        mensagem.textContent = "";

        renderizar();

    }


    function renderizar() {

        quebraCabeca.innerHTML = "";


        tabuleiro.forEach(
            (item, indice) => {

                const peca =
                    document.createElement("button");

                peca.className = "peca";


                if (item === "") {

                    peca.classList.add("vazia");

                } else {

                    peca.textContent = item;

                    peca.onclick =
                        () => mover(indice);

                }


                quebraCabeca.appendChild(peca);

            }
        );

    }


    function mover(indice) {

        const vazio =
            tabuleiro.indexOf("");

        const movimentosPossiveis = [

            vazio - 1,
            vazio + 1,
            vazio - 3,
            vazio + 3

        ];


        if (
            movimentosPossiveis.includes(indice)
        ) {


            const mesmaLinha =
                Math.floor(indice / 3) ===
                Math.floor(vazio / 3);


            const movimentoVertical =
                Math.abs(indice - vazio) === 3;


            if (mesmaLinha || movimentoVertical) {

                [
                    tabuleiro[indice],
                    tabuleiro[vazio]
                ] =
                [
                    tabuleiro[vazio],
                    tabuleiro[indice]
                ];


                renderizar();

                verificar();

            }

        }

    }


    function verificar() {



        const objetivo =
            puzzles[puzzleAtual];

        if (
            JSON.stringify(tabuleiro) ===
            JSON.stringify(objetivo)
        ) {

            mensagem.textContent =
                "🌟 Muito bem! Você completou a nebulosa!";

        }

    }




    function embaralhar() {

        for (let i = 0; i < 25; i++) {

            const vazio =
                tabuleiro.indexOf("");

            const possibilidades =
                [];

            [
                vazio - 1,
                vazio + 1,
                vazio - 3,
                vazio + 3
            ].forEach(indice => {

                if (
                    indice >= 0 &&
                    indice < 9
                ) {

                    const mesmaLinha =
                        Math.floor(indice / 3) ===
                        Math.floor(vazio / 3);

                    const vertical =
                        Math.abs(indice - vazio) === 3;

                    if (
                        mesmaLinha ||
                        vertical
                    ) {
                        possibilidades.push(indice);
                    }

                }

            });


            const escolhido =
                possibilidades[
                    Math.floor(
                        Math.random() *
                        possibilidades.length
                    )
                ];


            [
                tabuleiro[escolhido],
                tabuleiro[vazio]
            ] =
            [
                tabuleiro[vazio],
                tabuleiro[escolhido]
            ];

        }

    }


    tabuleiro = [...puzzles[0]];

    embaralhar();

    renderizar();

</script>

</body>

</html>
