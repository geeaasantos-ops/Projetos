<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vídeos do Cosmo | Space Kids</title>

    <style>
:root {
    --fundo: #f6f0ff;
    --roxo: #cdb8f5;
    --roxo-escuro: #9278bd;
    --azul: #c4e6ff;
    --rosa: #f9d6e9;
    --texto: #665a79;
    --branco: #ffffff;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 24px 16px 40px;
    min-height: 100vh;

    font-family: 'Comic Sans MS', 'Chalkboard SE',
        cursive, sans-serif;

    color: var(--texto);

    background:
        radial-gradient(circle at 9% 15%,
            #ffffff 0 4px, transparent 5px),
        radial-gradient(circle at 88% 20%,
            #ffe8f5 0 5px, transparent 6px),
        radial-gradient(circle at 15% 82%,
            #e4dcff 0 5px, transparent 6px),
        linear-gradient(
            140deg,
            #f6f0ff 0%,
            #e9f4ff 52%,
            #fff0f7 100%
        );

    background-size:
        110px 110px,
        150px 150px,
        180px 180px,
        auto;

    background-attachment: fixed;
}

/* Cabeçalho */

header {
    text-align: center;
    max-width: 750px;
    margin: 14px auto 30px;
}

header h1 {
    color: #8c73b2;
    font-size: clamp(2rem, 5vw, 2.7rem);
    margin: 25px 0 12px;

    text-shadow: 2px 3px 0 #ffffff;
    letter-spacing: 0.5px;
}

header p {
    max-width: 600px;
    margin: 0 auto;

    font-size: 1.08rem;
    line-height: 1.8;
    color: #7d718f;
}

/* Botão voltar */

.voltar {
    display: inline-block;

    background: rgba(255, 255, 255, 0.93);
    color: #8971ad;

    padding: 11px 23px;
    border: 2px solid #ffffff;
    border-radius: 30px;

    text-decoration: none;
    font-weight: bold;

    box-shadow:
        0 5px 0 #e1d4f4,
        0 8px 16px rgba(116, 92, 151, 0.12);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

.voltar:hover {
    background: #fff9fd;
    transform: translateY(-3px);

    box-shadow:
        0 8px 0 #e1d4f4,
        0 12px 20px rgba(116, 92, 151, 0.15);
}

.voltar:focus-visible {
    outline: 3px solid #9278bd;
    outline-offset: 4px;
}

/* Conteúdo */

.conteudo {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
}

/* Cartão principal */

.caixa {
    background: rgba(255, 255, 255, 0.88);

    padding: clamp(18px, 4vw, 32px);
    margin-bottom: 25px;

    border: 3px solid rgba(255, 255, 255, 0.98);
    border-radius: 32px;

    box-shadow:
        0 12px 30px rgba(116, 92, 151, 0.12),
        inset 0 0 20px rgba(255, 255, 255, 0.7);

    text-align: center;
    backdrop-filter: blur(8px);
}

.caixa h2 {
    color: #8d76b1;
    font-size: clamp(1.4rem, 4vw, 1.8rem);
    margin: 0 0 12px;
}

.caixa > p {
    line-height: 1.8;
    color: #81758f;
}

/* Botões dos vídeos */

.videos {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(170px, 1fr));

    gap: 16px;
    margin: 25px 0;
}

.video-btn {
    min-height: 125px;
    padding: 20px 14px;

    border: 2px solid #ffffff;
    border-radius: 24px;

    background: linear-gradient(
        145deg,
        #f1e8ff,
        #e7f3ff
    );

    color: #75658d;
    font-family: inherit;
    font-size: 1rem;
    font-weight: bold;
    line-height: 1.5;

    cursor: pointer;

    box-shadow:
        0 5px 0 #d9cbed,
        0 8px 14px rgba(116, 92, 151, 0.08);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

.video-btn:nth-child(2) {
    background: linear-gradient(
        145deg,
        #e1f3ff,
        #e8e5ff
    );

    box-shadow:
        0 5px 0 #c9ddec,
        0 8px 14px rgba(116, 92, 151, 0.08);
}

.video-btn:nth-child(3) {
    background: linear-gradient(
        145deg,
        #e5f9e9,
        #e4f4ff
    );

    box-shadow:
        0 5px 0 #c8e5d0,
        0 8px 14px rgba(116, 92, 151, 0.08);
}

.video-btn:nth-child(4) {
    background: linear-gradient(
        145deg,
        #ffeaf5,
        #eee5ff
    );

    box-shadow:
        0 5px 0 #ead0e5,
        0 8px 14px rgba(116, 92, 151, 0.08);
}

.video-btn:hover {
    transform: translateY(-4px);

    box-shadow:
        0 9px 0 #d9cbed,
        0 13px 18px rgba(116, 92, 151, 0.13);
}

.video-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #d9cbed;
}

.video-btn:focus-visible {
    outline: 3px solid #9278bd;
    outline-offset: 4px;
}

.video-btn .icone {
    display: block;
    font-size: 2.7rem;
    margin-bottom: 10px;

    transition: transform 0.2s ease;
}

.video-btn:hover .icone {
    transform: scale(1.12) rotate(-4deg);
}

/* Área do vídeo */

.video {
    position: relative;

    width: 100%;
    height: 0;
    padding-bottom: 56.25%;

    overflow: hidden;
    margin-top: 25px;

    border: 4px solid #ffffff;
    border-radius: 25px;

    background: linear-gradient(
        135deg,
        #e8ddff,
        #dff1ff
    );

    box-shadow:
        0 0 0 2px #e5d9f5,
        0 10px 22px rgba(116, 92, 151, 0.12);
}

.video iframe {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    border: none;
    border-radius: 20px;
}

/* Mensagem do vídeo selecionado */

.aviso {
    display: inline-block;

    max-width: 100%;
    margin: 20px 0 0;
    padding: 12px 20px;

    background: #faf5ff;
    border: 1px solid #e9def8;
    border-radius: 20px;

    color: #84709e;
    font-size: 0.95rem;
    line-height: 1.7;

    overflow-wrap: anywhere;
}

/* Adaptação para celulares */

@media (max-width: 600px) {
    body {
        padding: 16px 10px 30px;
    }

    header {
        margin-bottom: 22px;
    }

    header p {
        font-size: 1rem;
    }

    .caixa {
        padding: 18px 13px;
        border-radius: 25px;
    }

    .videos {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 11px;
    }

    .video-btn {
        min-height: 115px;
        padding: 15px 8px;
        font-size: 0.9rem;
        border-radius: 19px;
    }

    .video-btn .icone {
        font-size: 2.3rem;
    }

    .video {
        border-radius: 18px;
        border-width: 3px;
    }

    .video iframe {
        border-radius: 14px;
    }

    .aviso {
        padding: 10px 13px;
        font-size: 0.88rem;
    }
}

/* Acessibilidade */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}
    </style>

</head>


<body>


<header>

    <a
        href="PÁGINA.HTML"
        class="voltar"
    >
        ← Voltar
    </a>

    <h1>
        🎧 Vídeos do Cosmo
    </h1>

    <p>
        Escolha um vídeo tranquilo e aproveite
        um momento de calma.
    </p>

</header>


<main class="conteudo">


    <section class="caixa">

        <h2>
            🌙 Vídeos relaxantes
        </h2>

        <p>
            Escolha um dos vídeos abaixo.
        </p>


        <!-- BOTÕES -->

        <div class="videos">


            <button
                class="video-btn"
                onclick="trocarVideo('chuva')"
            >

                <span class="icone">
                    🌧️
                </span>

                Chuva tranquila

            </button>


            <button
                class="video-btn"
                onclick="trocarVideo('oceano')"
            >

                <span class="icone">
                    🌊
                </span>

                Ondas do oceano

            </button>


            <button
                class="video-btn"
                onclick="trocarVideo('floresta')"
            >

                <span class="icone">
                    🌳
                </span>

                Floresta

            </button>


            <button
                class="video-btn"
                onclick="trocarVideo('espaco')"
            >

                <span class="icone">
                    🌌
                </span>

                Espaço

            </button>


        </div>


        <!-- VÍDEO -->

        <div class="video">

            <iframe
                id="videoPlayer"
                src="https://www.youtube.com/embed/2OEL4P1Rz04"
                title="Vídeo relaxante"
                allowfullscreen>
            </iframe>

        </div>


        <p id="videoAtual" class="aviso">
            🌧️ Vídeo relaxante selecionado.
        </p>


    </section>


</main>


<script>

    const videoPlayer =
        document.getElementById("videoPlayer");

    const videoAtual =
        document.getElementById("videoAtual");


    /*
    Vídeos disponíveis.

    Para trocar os vídeos, altere apenas
    os links abaixo.
    */

    const videos = {

chuva: {
    nome: "🌧️ Chuva tranquila",
    link: "https://www.youtube.com/embed/nRh08p-jERg"
},

oceano: {
    nome: "🌊 Ondas do oceano",
    link: "https://www.youtube.com/embed/uom6RoyqFiE"
},

floresta: {
    nome: "🌳 Floresta",
    link: "https://www.youtube.com/embed/OByhSFzgGnA"
},

espaco: {
    nome: "🌌 Espaço",
    link: "https://www.youtube.com/embed/X-XZx1o_w-A"
}

};

    function trocarVideo(tipo) {

        const video =
            videos[tipo];


        videoPlayer.src =
            video.link;


        videoAtual.textContent =
            "🎬 Assistindo: " +
            video.nome;

    }

</script>


</body>

</html>
