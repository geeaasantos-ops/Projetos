<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Kids - Cadastro</title>

    <style>
        body {
            background-color: #FFDE59;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 0px #FF914D;
            width: 350px;
            text-align: center;
            border: 5px solid #5271FF;
        }

        h1 {
            color: #5271FF;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #FF66C4;
            font-weight: bold;
            margin-bottom: 5px;
            margin-left: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 3px solid #CBEDD5;
            border-radius: 15px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #5271FF;
        }

        button {
            background-color: #7ED957;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0px #5F9E44;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.03);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #5F9E44;
        }

        .decoracao {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .admin-btn {
            display: block;
            margin-top: 25px;
            background-color: #5271FF;
            box-shadow: 0 5px 0px #354fc2;
            text-decoration: none;
            color: white;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="decoracao">🚀🎨🌈</div>

    <h1>Entrar na Aventura!</h1>

    <form>
        <div class="input-group">
            <label for="nome">Nome da Criança:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Ex: Pedro"
                required
            >
        </div>

        <div class="input-group">
            <label for="email">E-mail do Responsável:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="email@exemplo.com"
                required
            >
        </div>

        <button type="submit">
            VAMOS LÁ! 🚀
        </button>
    </form>

    <!-- BOTÃO PARA ÁREA ADMINISTRATIVA -->
    <a href="Admin.html" class="admin-btn">
        ⚙️ Área Administrativa
    </a>

</div>

<script>
    document.querySelector("form").addEventListener("submit", function(event) {
        event.preventDefault();

        alert("Cadastro realizado! 🚀");

        window.open("Página.HTML", "_blank");
    });
</script>

</body>
</html>
