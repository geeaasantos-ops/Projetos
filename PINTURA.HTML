<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pintura Estelar | Space Kids</title>

<style>
:root {
    --fundo: #fff4fa;
    --rosa: #f5b8d2;
    --rosa-escuro: #d987b0;
    --roxo: #cdb8f5;
    --azul: #bde4ff;
    --amarelo: #ffe9a8;
    --texto: #6b617d;
    --branco: #ffffff;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 24px 16px 40px;
    min-height: 100vh;

    font-family: 'Comic Sans MS', 'Chalkboard SE',
        cursive, sans-serif;

    color: var(--texto);

    background:
        radial-gradient(circle at 8% 12%,
            #ffffff 0 4px, transparent 5px),
        radial-gradient(circle at 91% 20%,
            #ffe6f2 0 6px, transparent 7px),
        radial-gradient(circle at 13% 82%,
            #e4d9ff 0 5px, transparent 6px),
        linear-gradient(
            140deg,
            #fff4fa 0%,
            #f0eaff 48%,
            #e7f5ff 100%
        );

    background-size:
        100px 100px,
        150px 150px,
        180px 180px,
        auto;

    background-attachment: fixed;
}

/* Cabeçalho */

header {
    text-align: center;
    max-width: 800px;
    margin: 12px auto 28px;
}

header h1 {
    color: #a879b7;
    font-size: clamp(2rem, 5vw, 2.8rem);
    margin: 24px 0 12px;
    text-shadow: 2px 3px 0 #ffffff;
    letter-spacing: 0.5px;
}

header p {
    max-width: 600px;
    margin: 0 auto;
    font-size: 1.08rem;
    line-height: 1.8;
    color: #81748f;
}

/* Botão voltar */

.voltar {
    display: inline-block;
    padding: 11px 23px;

    background: rgba(255, 255, 255, 0.92);
    color: #9b72b1;

    border: 2px solid #ffffff;
    border-radius: 30px;

    text-decoration: none;
    font-weight: bold;

    box-shadow:
        0 5px 0 #e5d6f3,
        0 8px 16px rgba(130, 102, 158, 0.12);

    transition: transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
}

.voltar:hover {
    background: #fff8fc;
    transform: translateY(-3px);
    box-shadow:
        0 8px 0 #e5d6f3,
        0 12px 20px rgba(130, 102, 158, 0.15);
}

.voltar:focus-visible {
    outline: 3px solid #a879b7;
    outline-offset: 4px;
}

/* Painel da pintura */

.painel {
    max-width: 1000px;
    width: 100%;
    margin: 25px auto;

    padding: clamp(18px, 4vw, 30px);

    background: rgba(255, 255, 255, 0.88);
    border: 3px solid rgba(255, 255, 255, 0.98);
    border-radius: 32px;

    box-shadow:
        0 12px 30px rgba(130, 102, 158, 0.13),
        inset 0 0 20px rgba(255, 255, 255, 0.7);

    backdrop-filter: blur(8px);
}

/* Ferramentas */

.ferramentas {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 13px;

    margin-bottom: 24px;
    padding: 17px;

    background: linear-gradient(
        135deg,
        #fff2f8,
        #f2edff,
        #eef8ff
    );

    border: 2px dashed #e1d2f3;
    border-radius: 24px;
}

.ferramentas label {
    font-weight: bold;
    color: #82709e;
}

/* Seletor de cores */

input[type="color"] {
    width: 52px;
    height: 45px;
    padding: 4px;

    border: 3px solid #ffffff;
    border-radius: 14px;

    background: #ffffff;
    box-shadow: 0 3px 8px rgba(130, 102, 158, 0.12);

    cursor: pointer;
    transition: transform 0.2s ease;
}

input[type="color"]:hover {
    transform: scale(1.07) rotate(-3deg);
}

/* Controle de tamanho do pincel */

input[type="range"] {
    width: 135px;
    accent-color: #b69ae9;
    cursor: pointer;
}

/* Botões */

button {
    border: 2px solid #ffffff;
    padding: 11px 19px;
    border-radius: 25px;

    background: linear-gradient(
        135deg,
        #f4b9d5,
        #d6bdf5
    );

    color: #ffffff;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 0 #d4a9d5,
        0 7px 12px rgba(130, 102, 158, 0.12);

    transition: transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
}

button:hover {
    transform: translateY(-3px);
    filter: brightness(1.04);

    box-shadow:
        0 8px 0 #d4a9d5,
        0 11px 16px rgba(130, 102, 158, 0.16);
}

button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #d4a9d5;
}

button:focus-visible {
    outline: 3px solid #a879b7;
    outline-offset: 4px;
}

/* Área de desenho */

#tela {
    display: block;

    width: 100%;
    max-width: 900px;
    height: 500px;

    margin: 0 auto;

    background: #ffffff;
    border: 4px solid #e8d9f7;
    border-radius: 23px;

    box-shadow:
        inset 0 0 0 3px #fff7fc,
        0 7px 18px rgba(130, 102, 158, 0.10);

    cursor: crosshair;
    touch-action: none;
}

/* Instrução */

.dica {
    text-align: center;
    margin: 20px 0 4px;
    padding: 13px;

    font-size: 0.98rem;
    line-height: 1.7;
    color: #89769e;

    background: #fff4fa;
    border: 1px solid #f4dcec;
    border-radius: 18px;
}

/* Celulares e telas pequenas */

@media (max-width: 600px) {
    body {
        padding: 16px 10px 30px;
    }

    header {
        margin-bottom: 22px;
    }

    header p {
        font-size: 1rem;
    }

    .painel {
        padding: 14px;
        border-radius: 25px;
    }

    .ferramentas {
        gap: 11px;
        padding: 14px 10px;
        border-radius: 20px;
    }

    .ferramentas label {
        font-size: 0.92rem;
    }

    input[type="range"] {
        width: 105px;
        max-width: 100%;
    }

    button {
        padding: 10px 14px;
        font-size: 0.9rem;
    }

    #tela {
        height: 400px;
        border-width: 3px;
        border-radius: 17px;
    }

    .dica {
        font-size: 0.9rem;
    }
}

/* Acessibilidade: reduzir transições */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

</head>

<body>

<header>

    <a
        href="PÁGINA.HTML"
        class="voltar"
    >
        ← Voltar
    </a>

    <h1>
        🎨 Pintura Estelar
    </h1>

    <p>
        Use sua criatividade para desenhar
        sua própria galáxia!
    </p>

</header>


<main class="painel">

    <div class="ferramentas">

        <label>
            🎨 Cor:
        </label>

        <input
            type="color"
            id="cor"
            value="#7b61ff"
        >


        <label>
            🖌️ Tamanho:
        </label>

        <input
            type="range"
            id="tamanho"
            min="2"
            max="40"
            value="8"
        >


        <button onclick="borracha()">
            🧽 Borracha
        </button>


        <button onclick="pincel()">
            🖌️ Pincel
        </button>


        <button onclick="limpar()">
            🗑️ Limpar
        </button>

    </div>


    <canvas
        id="tela"
        width="900"
        height="500"
    ></canvas>


    <p class="dica">
        ✨ Desenhe com o mouse ou toque na tela!
    </p>

</main>


<script>

    const canvas =
        document.getElementById("tela");

    const ctx =
        canvas.getContext("2d");


    const cor =
        document.getElementById("cor");

    const tamanho =
        document.getElementById("tamanho");


    let desenhando = false;

    let usandoBorracha = false;



    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    function obterPosicao(evento) {

        const rect =
            canvas.getBoundingClientRect();


        const escalaX =
            canvas.width /
            rect.width;


        const escalaY =
            canvas.height /
            rect.height;


        let x;
        let y;


        if (
            evento.touches &&
            evento.touches.length > 0
        ) {

            x =
                (evento.touches[0].clientX -
                rect.left) *
                escalaX;

            y =
                (evento.touches[0].clientY -
                rect.top) *
                escalaY;

        } else {

            x =
                (evento.clientX -
                rect.left) *
                escalaX;

            y =
                (evento.clientY -
                rect.top) *
                escalaY;

        }


        return { x, y };

    }


    function começar(evento) {

        evento.preventDefault();

        desenhando = true;

        const posicao =
            obterPosicao(evento);

        ctx.beginPath();

        ctx.moveTo(
            posicao.x,
            posicao.y
        );

    }


    function desenhar(evento) {

        if (!desenhando) return;

        evento.preventDefault();

        const posicao =
            obterPosicao(evento);


        ctx.lineWidth =
            tamanho.value;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";


        if (usandoBorracha) {

            ctx.strokeStyle = "#ffffff";

        } else {

            ctx.strokeStyle =
                cor.value;

        }


        ctx.lineTo(
            posicao.x,
            posicao.y
        );

        ctx.stroke();

    }


    function parar() {

        desenhando = false;

        ctx.beginPath();

    }


    function borracha() {

        usandoBorracha = true;

    }


    function pincel() {

        usandoBorracha = false;

    }


    function limpar() {

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }



    canvas.addEventListener(
        "mousedown",
        começar
    );

    canvas.addEventListener(
        "mousemove",
        desenhar
    );

    canvas.addEventListener(
        "mouseup",
        parar
    );

    canvas.addEventListener(
        "mouseleave",
        parar
    );



    canvas.addEventListener(
        "touchstart",
        começar,
        { passive: false }
    );

    canvas.addEventListener(
        "touchmove",
        desenhar,
        { passive: false }
    );

    canvas.addEventListener(
        "touchend",
        parar
    );

</script>

</body>

</html>
