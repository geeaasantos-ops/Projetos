<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pintura Estelar | Space Kids</title>

<style>

    :root {
        --fundo: #fff4f8;
        --rosa: #ffafcc;
        --roxo: #cdb4db;
        --texto: #6b6870;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;

        min-height: 100vh;

        background: linear-gradient(
            135deg,
            #fff4f8,
            #f2e9ff
        );

        font-family:
            'Comic Sans MS',
            'Chalkboard SE',
            cursive;

        color: var(--texto);
    }

    header {
        text-align: center;
    }

    header h1 {
        color: #8b5f78;
    }

    .voltar {
        display: inline-block;

        background: white;

        padding: 10px 20px;

        border-radius: 30px;

        text-decoration: none;

        color: #8b5f78;

        font-weight: bold;
    }

    .painel {
        max-width: 1000px;

        margin: 25px auto;

        background: white;

        padding: 20px;

        border-radius: 25px;

        box-shadow:
            0 10px 25px
            rgba(0,0,0,.08);
    }

    .ferramentas {
        display: flex;

        flex-wrap: wrap;

        justify-content: center;

        align-items: center;

        gap: 12px;

        margin-bottom: 20px;
    }

    .ferramentas label {
        font-weight: bold;
    }

    input[type="color"] {
        width: 50px;
        height: 40px;

        border: none;

        cursor: pointer;
    }

    input[type="range"] {
        width: 130px;
    }

    button {
        border: none;

        padding: 10px 18px;

        border-radius: 25px;

        background: var(--rosa);

        color: white;

        font-family: inherit;

        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        transform: scale(1.04);
    }

    #tela {

        display: block;

        width: 100%;

        max-width: 900px;

        height: 500px;

        margin: auto;

        background: white;

        border: 4px solid #e8d7e1;

        border-radius: 18px;

        cursor: crosshair;

        touch-action: none;
    }

    .dica {
        text-align: center;

        margin-top: 15px;

        font-size: .95rem;
    }

    @media(max-width:600px) {

        #tela {
            height: 400px;
        }

    }

</style>

</head>

<body>

<header>

    <a
        href="PÁGINA.HTML"
        class="voltar"
    >
        ← Voltar
    </a>

    <h1>
        🎨 Pintura Estelar
    </h1>

    <p>
        Use sua criatividade para desenhar
        sua própria galáxia!
    </p>

</header>


<main class="painel">

    <div class="ferramentas">

        <label>
            🎨 Cor:
        </label>

        <input
            type="color"
            id="cor"
            value="#7b61ff"
        >


        <label>
            🖌️ Tamanho:
        </label>

        <input
            type="range"
            id="tamanho"
            min="2"
            max="40"
            value="8"
        >


        <button onclick="borracha()">
            🧽 Borracha
        </button>


        <button onclick="pincel()">
            🖌️ Pincel
        </button>


        <button onclick="limpar()">
            🗑️ Limpar
        </button>

    </div>


    <canvas
        id="tela"
        width="900"
        height="500"
    ></canvas>


    <p class="dica">
        ✨ Desenhe com o mouse ou toque na tela!
    </p>

</main>


<script>

    const canvas =
        document.getElementById("tela");

    const ctx =
        canvas.getContext("2d");


    const cor =
        document.getElementById("cor");

    const tamanho =
        document.getElementById("tamanho");


    let desenhando = false;

    let usandoBorracha = false;



    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    function obterPosicao(evento) {

        const rect =
            canvas.getBoundingClientRect();


        const escalaX =
            canvas.width /
            rect.width;


        const escalaY =
            canvas.height /
            rect.height;


        let x;
        let y;


        if (
            evento.touches &&
            evento.touches.length > 0
        ) {

            x =
                (evento.touches[0].clientX -
                rect.left) *
                escalaX;

            y =
                (evento.touches[0].clientY -
                rect.top) *
                escalaY;

        } else {

            x =
                (evento.clientX -
                rect.left) *
                escalaX;

            y =
                (evento.clientY -
                rect.top) *
                escalaY;

        }


        return { x, y };

    }


    function começar(evento) {

        evento.preventDefault();

        desenhando = true;

        const posicao =
            obterPosicao(evento);

        ctx.beginPath();

        ctx.moveTo(
            posicao.x,
            posicao.y
        );

    }


    function desenhar(evento) {

        if (!desenhando) return;

        evento.preventDefault();

        const posicao =
            obterPosicao(evento);


        ctx.lineWidth =
            tamanho.value;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";


        if (usandoBorracha) {

            ctx.strokeStyle = "#ffffff";

        } else {

            ctx.strokeStyle =
                cor.value;

        }


        ctx.lineTo(
            posicao.x,
            posicao.y
        );

        ctx.stroke();

    }


    function parar() {

        desenhando = false;

        ctx.beginPath();

    }


    function borracha() {

        usandoBorracha = true;

    }


    function pincel() {

        usandoBorracha = false;

    }


    function limpar() {

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }



    canvas.addEventListener(
        "mousedown",
        começar
    );

    canvas.addEventListener(
        "mousemove",
        desenhar
    );

    canvas.addEventListener(
        "mouseup",
        parar
    );

    canvas.addEventListener(
        "mouseleave",
        parar
    );



    canvas.addEventListener(
        "touchstart",
        começar,
        { passive: false }
    );

    canvas.addEventListener(
        "touchmove",
        desenhar,
        { passive: false }
    );

    canvas.addEventListener(
        "touchend",
        parar
    );

</script>

</body>

</html>
